<div class="toggle">
  <input
    type="checkbox"
    role="switch"
    [id]="fieldId()"
    [attr.data-testid]="fieldId()"
    [checked]="checked() && !disabled()"
    [disabled]="disabled()"
    [attr.aria-describedby]="note() === '' ? null : fieldId() + '-hint'"
    (change)="onChange($event)"
  />
  <label [for]="fieldId()">{{ label() }}</label>
  @if (note() !== '') {
    <p class="hint" [id]="fieldId() + '-hint'">{{ note() }}</p>
  }
</div>
