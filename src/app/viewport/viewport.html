<figure class="viewport" [attr.data-backend]="backend()">
  <canvas
    #canvas
    [attr.width]="size"
    [attr.height]="size"
    role="img"
    [attr.aria-label]="description()"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerEnd($event)"
    (pointercancel)="onPointerEnd($event)"
    (wheel)="onWheel($event)"
    data-testid="viewport-canvas"
    [attr.data-state]="state()"
    [attr.data-backend]="backend()"
    [attr.data-generation]="progress()?.generation ?? null"
    [attr.data-passes-done]="progress()?.passesDone ?? null"
    [attr.data-passes-total]="progress()?.passesTotal ?? null"
    [attr.data-complete]="progress()?.complete ?? null"
    [attr.data-first-image-ms]="firstImageMilliseconds()"
    [attr.data-full-image-ms]="fullImageMilliseconds()"
  ></canvas>
  <figcaption>
    @switch (state()) {
      @case ('starting') {
        @if (backend() === 'cpu') {
          Starting the software renderer.
        } @else {
          Rendering the first frame.
        }
      }
      @case ('rendered') {
        Disk seen at {{ inclinationDegrees() }} degrees from the axis, observer at
        {{ settings().view.distance }} M.
      }
      @case ('failed') {
        @if (backend() === 'cpu') {
          The software renderer stopped: {{ failureDetail() }}.
        } @else {
          The first frame could not be rendered.
        }
      }
    }
  </figcaption>
  @if (progress(); as current) {
    <p class="render-progress" data-testid="render-progress">
      <progress [value]="current.fraction" max="1" aria-label="Software render progress"></progress>
      <span data-testid="render-progress-text">{{ progressText() }}</span>
    </p>
  }
  <app-overlay-legend [overlays]="shownSettings().overlays" [split]="settings().split" />
  <div class="actions">
    @if (backend() === 'gpu') {
      <label class="export-size">
        Export size
        <select data-testid="export-size" (change)="chooseEdge($event)">
          @for (edge of exportEdges; track edge) {
            <option [value]="edge" [selected]="edge === saveEdge()">{{ edge }} px</option>
          }
        </select>
      </label>
    }
    <button
      type="button"
      data-testid="save-image"
      [disabled]="state() !== 'rendered' || exportState() === 'working'"
      (click)="saveImage()"
    >
      Save image ({{ saveEdge() }} px)
    </button>
    <p class="export-status" role="status" data-testid="export-status">
      @switch (exportState()) {
        @case ('working') {
          Rendering the image.
        }
        @case ('done') {
          Image saved.
        }
        @case ('failed') {
          The image could not be saved.
        }
      }
    </p>
  </div>
</figure>
